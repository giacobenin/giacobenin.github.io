# Site settings
title                    : "Giacomo Benincasa"
title_separator          : "-"
name                     : "Giacomo Benincasa"
description              : "Senior software engineer: distributed systems, cloud platforms, networking research."
tagline                  : "Senior Software Engineer & Researcher"   # home page <title>: "<title> | <tagline>"
url                      : "https://gbenin.casa"
baseurl                  : ""
repository               : "giacobenin/giacobenin.github.io"
locale                   : "en-US"

# No theme: layouts are in _layouts/, styles in assets/css/main.scss.

# Sidebar profile
author:
  name   : "Giacomo Benincasa"
  id     : "/#person"   # IRI of the site owner (on the home page, the identity hub), used by all RDFa and JSON-LD
  publication_name : "G. Benincasa"   # how your name appears in _publications/ author lists (shown in bold)
  same_as :          # identity links that aren't visible profile links (schema:sameAs only)
    - "https://www.wikidata.org/wiki/Q142072471"
    - "https://dblp.org/pid/74/10923"
  avatar : # "/assets/images/profile.jpg"  (uncomment after adding a square photo)
  bio    : "Senior Software Engineer"
  location : # optional
  links:            # icon: file name in _includes/icons/ (shown instead of the label; label becomes its accessible name)
    - label: "Google Scholar"
      icon: "google-scholar"
      url: "https://scholar.google.com/citations?user=fa77M2IAAAAJ"
    - label: "LinkedIn"
      icon: "linkedin"
      url: "https://www.linkedin.com/in/gbenincasa/"
    - label: "GitHub"
      icon: "github"
      url: "https://github.com/giacobenin"
    - label: "ORCID"
      icon: "orcid"
      url: "https://orcid.org/0000-0002-6357-9043"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/giacobenin"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/gbenincasa/"

# Build settings
sass:
  style: compressed   # the stylesheet is inlined in every page
markdown  : kramdown
permalink : /:categories/:title/
include   : ["_pages"]
exclude   : ["Gemfile", "Gemfile.lock", "README.md", "AGENTS.md", "CLAUDE.md", "vendor", ".bundle"]

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Publications are listed on one page, not rendered individually
collections:
  publications:
    output: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
