# Employers (`employers` in _data/cv.yml) and schools (`schools` in its
# `education` list), rendered on the CV as schema:Organization, or the
# schema.org class in `type`. Identified by Wikidata, with the official site
# as schema:url / schema:sameAs. `parent` is the Wikidata ID of the parent
# organization (schema:parentOrganization), e.g. a department's university.
"Amazon":  { name: "Amazon",  wikidata: Q3884,     url: "https://www.aboutamazon.com/" }
"AWS":     { name: "Amazon Web Services", wikidata: Q456157, url: "https://aws.amazon.com/" }   # provider of AWS services (_data/technologies.yml)
"Optym":   { name: "Optym",   wikidata: Q30282954, url: "https://www.optym.com/" }
"Amadeus": { name: "Amadeus IT Group", wikidata: Q696061, url: "https://amadeus.com/en" }
"IHMC":    { name: "Florida Institute for Human & Machine Cognition", wikidata: Q5461457, url: "https://www.ihmc.us/" }
"UWF":     { name: "University of West Florida", wikidata: Q659255, url: "https://uwf.edu/", type: CollegeOrUniversity }

# Schools
"UF":        { name: "University of Florida",                    wikidata: Q501758,  url: "https://www.ufl.edu/",        type: CollegeOrUniversity }
"UNIMORE":   { name: "University of Modena and Reggio Emilia",   wikidata: Q1243705, url: "https://www.unimore.it/",     type: CollegeOrUniversity }
"Sheffield-CS": { name: "Department of Computer Science, University of Sheffield", wikidata: Q86019290, url: "https://www.sheffield.ac.uk/cs", type: EducationalOrganization, parent: Q823917 }   # parent: University of Sheffield
