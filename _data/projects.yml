- name: "Fair Golf Teams"
  id: "https://fairgolfteams.neocities.org/"
  type: WebApplication
  url: "https://fairgolfteams.neocities.org/#/"
  category: "SportsApplication"
  description: "A web app for golf directors who need to split a field of players into balanced teams. Given each player's USGA Handicap Index, the number of teams, how many best balls count, and the handicap allowance, it runs simulations to build teams that are as evenly matched as possible."
  paper:
    title: "Algorithms and Software for the Golf Director Problem"
    doi: "10.3233/JSA-200346"
    journal: "Journal of Sports Analytics"
    issue: "6(3)"
    date: "2020-07-07"
